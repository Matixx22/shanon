# cargo-deny configuration — supply-chain policy enforced in CI.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Fail on any security advisory or unmaintained/yanked crate in the tree.
yanked = "deny"

[licenses]
version = 2
# Permissive licenses only. shanon ships under MIT; keep the dependency tree
# license-compatible and auditable.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Surface accidental duplicate versions of the same crate.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
