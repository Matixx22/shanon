name: Feature request
description: Suggest an enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that shanon makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should shanon do? How would you invoke it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they fall short.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This does not weaken the fail-closed guarantee or add raw/unscoped exemptions.
          required: true
