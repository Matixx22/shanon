name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# This job publishes the binaries users download and the `.sha256` they verify
# against, so a third-party action running here with `contents: write` could
# replace both. Every `uses:` is therefore pinned to a commit SHA — a tag is
# mutable and can be repointed at any commit by whoever owns the repository, or
# by whoever compromises it. Dependabot keeps the pins current.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # The compiler that builds a published artifact is pinned to an exact
    # version, not to a moving channel. `stable` would resolve to whatever it
    # meant at tag time, which made the toolchain the last non-deterministic
    # input to a release: re-running this workflow for the same tag could ship
    # different bytes. The build is already `--locked`, so with this pin the
    # whole input set is fixed.
    #
    # This must stay an environment variable rather than a `rustup default`,
    # because rust-toolchain.toml pins the repository to the MSRV (1.97) and
    # outranks `rustup default`. Without it the artifacts would silently be MSRV
    # builds, and `channel = "1.97"` itself floats across 1.97.x patches.
    #
    # Bumping this is a deliberate act: change it in its own commit, let CI's
    # `test` job (which still tracks stable) prove the new version first.
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Show active toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --release --locked -p shanon-cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="shanon-${REF_NAME}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$archive" shanon
          shasum -a 256 "$archive" > "$archive.sha256"

      # Windows gets a zip because that is what unpacks without extra tooling,
      # and PowerShell's own hasher because git-bash's coreutils are not
      # guaranteed on a runner image. The `.sha256` line keeps the
      # `<hash>  <file>` shape the other two targets emit, so one checksum
      # format documents all three.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $archive = "shanon-$env:REF_NAME-$env:TARGET.zip"
          Compress-Archive -Path "target/$env:TARGET/release/shanon.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          "$hash  $archive`n" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shanon-${{ matrix.target }}
          path: |
            shanon-*.tar.gz
            shanon-*.tar.gz.sha256
            shanon-*.zip
            shanon-*.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          generate_release_notes: true
