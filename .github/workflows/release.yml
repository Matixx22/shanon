name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# This workflow publishes the binaries users download and the `.sha256` they
# verify against, so anything running here that can write to the repository could
# replace both. Two rules follow from that.
#
# Every `uses:` is pinned to a commit SHA. A tag is mutable and can be repointed
# at any commit by whoever owns the repository, or by whoever compromises it.
# Dependabot keeps the pins current.
#
# Write access is granted per job rather than here, and only `release` gets it.
# `build` compiles third-party build scripts from crates.io (libz-sys compiles C)
# on six runners, and there is no reason for any of that to hold a token that can
# push. For the same reason every checkout sets `persist-credentials: false`, so
# no step after it inherits a usable token from `.git/config`.
permissions:
  contents: read

jobs:
  # A tag is the only input a release cannot re-derive, and nothing else checks
  # it. Tagging v0.7.1 on a tree still at 0.7.0 publishes six archives named for
  # a version their `--version` disagrees with, and the mismatch is only visible
  # after it is public. Runs before the matrix so it costs one runner, not six.
  verify-tag:
    name: tag matches the version in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped rather than failed on `workflow_dispatch`, where there is no tag
      # to compare. The job itself still succeeds so `build` is not skipped with
      # it.
      - name: Compare tag to workspace version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(awk -F'"' '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)"

          if [ -z "$version" ]; then
            echo "could not read version from [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "tag $REF_NAME does not match workspace version $version" >&2
            echo "either the version bump is missing from this commit, or the tag is wrong" >&2
            exit 1
          fi
          echo "tag $REF_NAME matches workspace version $version"

  build:
    needs: verify-tag
    strategy:
      fail-fast: false
      # Kept in sync by hand with the `test` job in ci.yml, which builds this
      # same list on every run (and runs the suite on all but the Intel macOS
      # one), so a target that stops compiling is caught on a pull request
      # rather than at tag time, when the fix costs a new tag.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Statically linked, so it runs on a distro whose glibc is older than
          # the runner's and inside a `scratch`/Alpine container. That is the
          # common shape of the machine a collection is triaged on.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          # Native arm64 runner rather than a cross-linker: the C zlib flate2
          # links is built by the same compiler that builds everything else.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-built from the arm64 runner; the macOS SDK carries both
          # architectures, so this needs no extra toolchain.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # The compiler that builds a published artifact is pinned to an exact
    # version, not to a moving channel. `stable` would resolve to whatever it
    # meant at tag time, which made the toolchain the last non-deterministic
    # input to a release: re-running this workflow for the same tag could ship
    # different bytes. The build is already `--locked`, so with this pin the
    # whole input set is fixed.
    #
    # This must stay an environment variable rather than a `rustup default`,
    # because rust-toolchain.toml pins the repository to the MSRV (1.97) and
    # outranks `rustup default`. Without it the artifacts would silently be MSRV
    # builds, and `channel = "1.97"` itself floats across 1.97.x patches.
    #
    # Bumping this is a deliberate act: change it in its own commit, let CI's
    # `test` job (which still tracks stable) prove the new version first.
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # flate2 links the C zlib, so the musl target needs a C compiler that
      # targets musl. The Rust side links itself self-contained and would not.
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Show active toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --release --locked -p shanon-cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="shanon-${REF_NAME}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "$archive" shanon
          shasum -a 256 "$archive" > "$archive.sha256"

      # Windows gets a zip because that is what unpacks without extra tooling,
      # and PowerShell's own hasher because git-bash's coreutils are not
      # guaranteed on a runner image. The `.sha256` line keeps the
      # `<hash>  <file>` shape the other two targets emit, so one checksum
      # format documents all three.
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $archive = "shanon-$env:REF_NAME-$env:TARGET.zip"
          Compress-Archive -Path "target/$env:TARGET/release/shanon.exe" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          "$hash  $archive`n" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline

      # `error` rather than the default warning. A packaging step that produces
      # nothing must not reach the publish job as an absent artifact, because
      # that is indistinguishable there from a target that was never built.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shanon-${{ matrix.target }}
          path: |
            shanon-*.tar.gz
            shanon-*.tar.gz.sha256
            shanon-*.zip
            shanon-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The one job that writes: it creates the release and uploads to it.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          # Off by default, which means an unmatched glob publishes a release
          # that is quietly short a platform. Nothing fails, and the gap is
          # visible only to whoever goes looking for their download.
          fail_on_unmatched_files: true
          generate_release_notes: true
