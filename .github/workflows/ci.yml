name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — surface new advisories without a push
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # rust-toolchain.toml pins the repository to the MSRV (1.97). This variable
    # outranks that file, so this job keeps testing against current stable —
    # without it, adding the pin would silently downgrade every check below to
    # 1.97 and lose stable coverage entirely.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Show active toolchain
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: msrv (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (MSRV)
        run: |
          rustup toolchain install 1.97 --profile minimal
          rustup default 1.97

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check against MSRV
        run: cargo check --workspace --all-targets --locked

  fixtures:
    name: no real collections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CONTRIBUTING.md forbids committing real collections, but .gitignore can
      # only block what it can name — a directory-form collection is loose
      # .json and matches no rule. This is the mechanical enforcement.
      - name: Check tracked files for real collection data
        run: ./scripts/check-fixtures.sh

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-deny

      # Supersedes the former `cargo audit` job. Same RustSec advisory database,
      # plus license enforcement (shanon ships MIT binaries and must not
      # redistribute a conflicting dependency) and source-registry pinning.
      # Configured in deny.toml.
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  binaries:
    name: binary (${{ matrix.target }})
    needs: test
    # A release build of every target release.yml ships, on every run. It serves
    # two purposes: a target that stops compiling (a new C dependency without a
    # musl story, a cross-build that needs a linker) fails a pull request rather
    # than a tag, where the only fix is a new tag; and a machine that is not the
    # one you develop on can be handed a binary to try. These are unsigned and
    # not release artifacts: `release.yml` produces the downloads users are meant
    # to verify against a published `.sha256`.
    #
    # Kept in sync by hand with the build matrix in release.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flate2 links the C zlib, so the musl target needs a C compiler that
      # targets musl. The Rust side links itself self-contained and would not.
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
        shell: bash

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --release --locked -p shanon-cli --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shanon-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/shanon
            target/${{ matrix.target }}/release/shanon.exe
          if-no-files-found: error
