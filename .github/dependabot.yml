version: 2

updates:
  # Actions go stale silently — nothing in CI fails when a pinned major falls
  # behind. Cargo is deliberately absent: Cargo.lock is committed and the
  # `cargo audit` job in ci.yml covers the risk that actually matters.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
