[package]
name = "shanon-core"
description = "Deterministic anonymization engine for SharpHound/BloodHound collections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
indexmap.workspace = true
sha2.workspace = true
blake2.workspace = true
regex.workspace = true
caseless.workspace = true
fancy-regex.workspace = true
thiserror.workspace = true
rustix.workspace = true
flate2.workspace = true
getrandom.workspace = true

# renamex_np FFI for the macOS no-replace publish path (§3.5); Linux uses rustix.
[target.'cfg(not(target_os = "linux"))'.dependencies]
libc.workspace = true

[dev-dependencies]
proptest.workspace = true
# `tests/zip.rs` inflates the published archive to assert its contents. The
# input archives it builds are STORED, so only the read side is needed.
flate2.workspace = true
